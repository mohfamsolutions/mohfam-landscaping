name: Deploy verified landscaping site
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: landscaping-production
    concurrency:
      group: landscaping-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/deployment-gate.mjs
      - run: node scripts/build.mjs
      - run: node scripts/verify.mjs
      - run: node --test tests/*.test.mjs
      - run: php -l public/api/contact.php
      - run: php -l public/404.php
      - run: node scripts/deploy.mjs
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_VERIFIED_DIRECTORY: ${{ vars.FTP_VERIFIED_DIRECTORY }}
      - run: node scripts/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscaping-release-evidence
          path: artifacts/
